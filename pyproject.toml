[project]
name = "theses-mcp"
version = "0.1.0"
description = "MCP server for theses.cz — search Czech university theses"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["mcp>=1.2", "requests", "beautifulsoup4", "lxml"]

[project.urls]
Homepage = "https://github.com/koprjaa/theses-mcp"

[project.scripts]
theses-mcp = "theses_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["theses_mcp.py"]
