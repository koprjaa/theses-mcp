# Project: theses-mcp
# File: Cargo.toml
# Description: Rust package and dependency definitions.
# Author: Jan Alexandr Kopřiva
# License: MIT
[package]
name = "theses-mcp"
version = "0.2.0"
edition = "2024"
authors = ["Jan Alexandr Kopřiva"]
license = "MIT"
description = "MCP server that searches Czech university theses and retrieves document links."
repository = "https://github.com/koprjaa/theses-mcp"

[lib]
name = "theses_mcp"
path = "src/lib.rs"

[[bin]]
name = "theses-mcp"
path = "src/main.rs"

[dependencies]
rmcp = { version = "3.6", default-features = false, features = ["server", "transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "gzip", "deflate", "cookies", "rustls-no-provider", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
scraper = { version = "0.29", default-features = false, features = ["errors"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
regex = "1"
encoding_rs = "0.8"
url = "2"
chromiumoxide = { version = "0.9", default-features = false }
futures-util = "0.3"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[dev-dependencies]
tempfile = "3"
base64 = "0.22"
